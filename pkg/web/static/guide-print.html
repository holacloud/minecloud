<!DOCTYPE html>
<html lang="es" class="gp-a5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de MineCloud</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2367a83f' d='M8 1l7 3.5-7 3.5-7-3.5z'/%3E%3Cpath fill='%237a5233' d='M1 4.5l7 3.5v7l-7-3.5z'/%3E%3Cpath fill='%235e3f27' d='M15 4.5l-7 3.5v7l7-3.5z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
    <!-- The printable guide, paginated by js/guidePrint.js: every .gp-sheet is one printed page. -->
    <style id="gp-page-style">@page { size: A5 portrait; margin: 0; }</style>
    <style>
        :root {
            --ink: #2b1d10; --ink-soft: #6b4f30; --accent: #8c2525; --rule: #b9a27a; --paper: #ffffff;
            --tint: #f1ead9; --code: #efe6d2;
            --body-font: 'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
            --head-font: 'Pixelify Sans', 'Courier New', monospace;
        }
        /* Paper sizes: the sheet, its inner margins, and type that reads well at that size. */
        html.gp-a5 { --paper-w: 148mm; --paper-h: 210mm; --pad: 9mm 11mm 7mm 12mm; --body-size: 11pt; --fig-max: 85mm; --mob: 38mm; --icon: 17mm; }
        html.gp-a4 { --paper-w: 210mm; --paper-h: 297mm; --pad: 13mm 16mm 10mm 17mm; --body-size: 12pt; --fig-max: 140mm; --mob: 50mm; --icon: 22mm; }
        html.gp-a5.gp-pixel { --body-size: 14.5pt; }
        html.gp-a4.gp-pixel { --body-size: 15.5pt; }
        html.gp-pixel { --body-font: 'VT323', 'Courier New', monospace; }
        html.gp-parchment { --paper: #f6ebcf; --tint: #ead9b0; --code: #e6d3a4; --rule: #c2a46c; }
        * { box-sizing: border-box; }
        html { background: #6f6a62; }
        body { margin: 0; color: var(--ink); font-family: var(--body-font); font-size: var(--body-size); line-height: 1.36; }

        /* ---- toolbar (screen only) ---- */
        #gp-toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
            padding: 10px 16px; background: #3a2614; color: #f1e3c0; font: 15px/1.3 'Segoe UI', Verdana, sans-serif;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); }
        #gp-toolbar .gp-brand { font-family: 'Pixelify Sans', monospace; font-size: 20px; margin-right: 6px; }
        #gp-toolbar .gp-group { display: inline-flex; align-items: center; gap: 4px; }
        #gp-toolbar button { font: inherit; color: #f1e3c0; background: #6b4528; border: 0; padding: 5px 12px; cursor: pointer;
            box-shadow: inset 0 -3px 0 #3f2716, 0 0 0 2px #2c1a0e; }
        #gp-toolbar button.active, #gp-toolbar #gp-print:not(:disabled) { background: #9c2a2a; box-shadow: inset 0 -3px 0 #6d1b1b, 0 0 0 2px #2c1a0e; }
        #gp-toolbar button:disabled { opacity: 0.45; cursor: progress; }
        #gp-toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        #gp-toolbar .gp-status-row { flex-basis: 100%; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #e8d6aa; }
        #gp-progress { width: 180px; height: 10px; }
        #gp-folios { width: 3.4em; font: inherit; }
        #gp-booklet-options[hidden] { display: none; }

        /* ---- sheets ---- */
        #gp-book { padding: 24px 12px 60px; }
        #gp-measure { position: absolute; left: -10000px; top: 0; visibility: hidden; pointer-events: none; }
        .gp-sheet { width: var(--paper-w); height: var(--paper-h); padding: var(--pad); margin: 0 auto 24px; background: var(--paper);
            display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            scroll-margin-top: 110px; }
        .gp-head { display: flex; align-items: baseline; gap: 8px; border-bottom: 1.5px solid var(--rule); padding-bottom: 1.2mm;
            margin-bottom: 3.5mm; font-family: var(--head-font); color: var(--ink-soft); font-size: 9pt; flex: none; }
        .gp-head-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gp-head-id { font-family: 'Atkinson Hyperlegible', 'Segoe UI', sans-serif; font-size: 7pt; opacity: 0.75; white-space: nowrap; }
        .gp-foot { flex: none; text-align: center; font-family: var(--head-font); font-size: 9.5pt; color: var(--ink-soft);
            padding-top: 2mm; }
        .gp-sheet-body { flex: 1; min-height: 0; display: flow-root; }
        .gp-measuring { height: auto; }
        .gp-measuring .gp-sheet-body { flex: none; }
        .gp-sheet-body > :first-child { margin-top: 0; }

        .gp-cover { align-items: center; justify-content: center; text-align: center; }
        .gp-cover-frame { border: 3px solid var(--rule); outline: 5px double var(--rule); outline-offset: 6px; padding: 14mm 8mm; width: 100%; }
        .gp-cover h1 { font-family: var(--head-font); font-size: 26pt; color: #5b3a22; margin: 0 0 8mm; line-height: 1.1; }
        html.gp-a4 .gp-cover h1 { font-size: 34pt; }
        .gp-cover img { width: 55%; image-rendering: pixelated; }
        .gp-subtitle { font-size: 1.15em; margin: 6mm 0 2mm; }
        .gp-edition { color: var(--ink-soft); font-size: 0.85em; }

        .gp-sheet-body h1, .gp-sheet-body h2, .gp-sheet-body h3 { font-family: var(--head-font); color: #5b3a22; line-height: 1.15; }
        .gp-sheet-body h1 { font-size: 1.7em; text-align: center; margin: 0 0 3mm; }
        .gp-sheet-body h2 { font-size: 1.25em; border-bottom: 2px dashed var(--rule); padding-bottom: 0.8mm; margin: 4mm 0 1.8mm; }
        .gp-sheet-body h3 { font-size: 1.08em; margin: 3mm 0 1.2mm; }
        .gp-sheet-body p, .gp-sheet-body ul, .gp-sheet-body ol { margin: 0 0 2mm; }
        .gp-sheet-body ul, .gp-sheet-body ol { padding-left: 1.4em; }
        .gp-sheet-body ul { list-style: none; }
        .gp-sheet-body ul > li::before { content: '■'; color: var(--accent); font-size: 0.6em; display: inline-block; width: 1.9em;
            margin-left: -1.9em; vertical-align: 0.2em; text-align: center; }
        .gp-sheet-body li { margin: 0.4mm 0; }
        .gp-sheet-body strong { color: #1c1208; }
        .gp-sheet-body em { color: var(--ink-soft); }
        .gp-sheet-body code { font-family: 'VT323', 'Courier New', monospace; font-size: 1.12em; background: var(--code); padding: 0 3px; }
        html.gp-pixel .gp-sheet-body code { font-size: 1em; }
        .gp-sheet-body a { color: var(--accent); text-decoration: none; }
        .gp-sheet-body a.gp-link::after { content: ' → p. ' attr(data-sheet); font-size: 0.82em; color: var(--ink-soft); white-space: nowrap; }
        .gp-sheet-body blockquote { margin: 2.5mm 0; padding: 1.5mm 3.5mm; background: var(--tint); border-left: 4px solid var(--rule); }
        .gp-sheet-body blockquote > :last-child { margin-bottom: 0; }
        .gp-sheet-body hr { border: 0; border-top: 3px dotted var(--rule); margin: 3mm 0; }
        .gp-sheet-body figure { margin: 2.5mm 0; text-align: center; }
        .gp-sheet-body figure img { max-width: 100%; max-height: var(--fig-max); image-rendering: pixelated; }
        .gp-sheet-body figure.gp-figure-mob img { width: var(--mob); height: var(--mob); object-fit: contain; image-rendering: auto; }
        .gp-sheet-body figure.gp-figure-item img, .gp-sheet-body figure img.gp-missing { width: var(--icon); height: var(--icon); }
        .gp-sheet-body figcaption { font-size: 0.88em; color: var(--ink-soft); margin-top: 1mm; }
        .gp-sheet-body p img, .gp-sheet-body li img, .gp-sheet-body td img, .gp-sheet-body th img { height: 1.3em; width: auto;
            vertical-align: -0.3em; image-rendering: pixelated; }
        .gp-sheet-body p img.gp-mob, .gp-sheet-body li img.gp-mob, .gp-sheet-body td img.gp-mob { height: 1.7em; image-rendering: auto; }
        .gp-sheet-body table { border-collapse: collapse; margin: 2.5mm 0; width: 100%; font-size: 0.84em; line-height: 1.25; }
        .gp-sheet-body table th, .gp-sheet-body table td { border: 1.2px solid var(--rule); padding: 0.8mm 1.6mm; text-align: left;
            vertical-align: top; overflow-wrap: anywhere; hyphens: auto; }
        .gp-sheet-body table th { background: var(--tint); font-family: var(--head-font); font-weight: 600; }
        .gp-notice { text-align: center; color: var(--ink-soft); background: var(--tint); padding: 1.2mm 3mm; font-size: 0.9em; }

        .gp-sheet-body ul.gp-toc-list { padding: 0; margin-bottom: 2mm; font-size: 0.95em; }
        .gp-sheet-body ul.gp-toc-list > li::before { content: none; }
        .gp-toc-list a { display: flex; align-items: baseline; gap: 4px; color: inherit; }
        .gp-toc-title { min-width: 0; }
        .gp-toc-dots { flex: 1; border-bottom: 1.5px dotted var(--rule); min-width: 6mm; transform: translateY(-3px); }
        .gp-toc-num { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 2.2em; text-align: right; }

        /* ---- booklets: two A5 sheets side by side on an A4 landscape side ---- */
        .gp-spread { width: 297mm; height: 210mm; margin: 0 auto 24px; display: flex; background: var(--paper);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); }
        .gp-spread > .gp-sheet { margin: 0; box-shadow: none; flex: none; }
        .gp-spread > .gp-sheet + .gp-sheet { border-left: 1px dashed #d6cbb3; }
        .gp-spread.gp-turned { transform: rotate(180deg); }
        .gp-spread-label { width: 297mm; margin: 0 auto 6px; color: #f1e3c0; font: 13px 'Segoe UI', Verdana, sans-serif; }
        @media (max-width: 820px) {
            #gp-book { overflow-x: auto; }
        }
        @media print {
            html, body { background: var(--paper); }
            html.gp-parchment, html.gp-parchment body, html.gp-parchment .gp-sheet { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #gp-toolbar, #gp-measure { display: none !important; }
            #gp-book { padding: 0; }
            /* A hair shorter than the paper, so rounding never spills a blank page. */
            .gp-sheet { margin: 0; box-shadow: none; height: calc(var(--paper-h) - 0.5mm); break-after: page; page-break-after: always; }
            .gp-sheet:last-child { break-after: auto; page-break-after: auto; }
            .gp-spread-label { display: none; }
            .gp-spread { margin: 0; box-shadow: none; height: calc(210mm - 0.5mm); overflow: hidden; break-after: page; page-break-after: always; }
            .gp-spread:last-child { break-after: auto; page-break-after: auto; }
            .gp-spread > .gp-sheet { height: calc(var(--paper-h) - 0.5mm); break-after: auto; page-break-after: auto; }
            .gp-spread > .gp-sheet + .gp-sheet { border-left: 0; }
        }
    </style>
</head>
<body>
    <div id="gp-toolbar">
        <span class="gp-brand">MineCloud</span>
        <span class="gp-group"><button class="gp-lang" type="button" data-lang="ES">ES</button><button class="gp-lang" type="button" data-lang="EN">EN</button></span>
        <span class="gp-group"><span id="gp-paper-label">Papel</span> <button class="gp-paper" type="button" data-paper="A5">A5</button><button class="gp-paper" type="button" data-paper="A4">A4</button><button class="gp-paper" type="button" data-paper="BOOKLET">Librillos A4</button></span>
        <span id="gp-booklet-options" class="gp-group" hidden><label><span id="gp-folios-label">Folios por librillo</span> <input id="gp-folios" type="number" min="1" max="15" step="1" value="6"></label>
            <label><input id="gp-long-edge" type="checkbox"> <span id="gp-long-edge-label">Volteo por borde largo</span></label></span>
        <label><input id="gp-ink" type="checkbox" checked> <span id="gp-ink-label">Ahorrar tinta</span></label>
        <span class="gp-group"><button class="gp-font" type="button" data-pixel="0">Fuente clara</button><button class="gp-font" type="button" data-pixel="1">Fuente pixel</button></span>
        <button id="gp-print" type="button" disabled>🖨 Imprimir</button>
        <div class="gp-status-row">
            <progress id="gp-progress" max="1" value="0"></progress>
            <span id="gp-status">…</span>
        </div>
    </div>
    <main id="gp-book"></main>
    <div id="gp-measure" aria-hidden="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/guideMarkdown.js"></script>
    <script>
        // The game's scripts mix their methods into Game.prototype; here there is no game to
        // run, only a class for them to hang on (the portraits use the bestiary's methods).
        class Game {}
    </script>
    <script src="js/guidePrint.js"></script>
</body>
</html>
