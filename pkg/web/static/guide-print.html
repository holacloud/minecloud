<!DOCTYPE html>
<html lang="es" class="gp-a5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de MineCloud</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2367a83f' d='M8 1l7 3.5-7 3.5-7-3.5z'/%3E%3Cpath fill='%237a5233' d='M1 4.5l7 3.5v7l-7-3.5z'/%3E%3Cpath fill='%235e3f27' d='M15 4.5l-7 3.5v7l7-3.5z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=VT323&display=swap">
    <!-- The printable guide, paginated by js/guidePrint.js: every .gp-page is one printed page. -->
    <style id="gp-page-style">@page { size: A5 portrait; margin: 0; }</style>
    <style>
        :root {
            --ink: #2b1d10; --ink-soft: #6b4f30; --accent: #8c2525; --rule: #b9a27a; --paper: #ffffff;
            --tint: #f1ead9; --code: #efe6d2;
            /* The colour of the volume printed (js/guidePrint.js, applyVolume): the chips and the contents' numbers. */
            --volume: #6b4528;
            --body-font: 'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
            /* The pixel font of headings, numbers and covers. It has one weight: every rule that uses it says
               font-weight 400, so that no browser fakes a bold that smears its pixels. To try another one,
               change it here, in the <link> above and in the fonts js/guidePrint.js waits for. */
            --head-font: 'VT323', 'Courier New', monospace;
            /* VT323 is drawn small for its size (the text itself needs 14.5pt of it to read like 11pt of the
               clear font), so what is set in it is this much larger. Where pages are counted (the header,
               the foot, the titles, the heads of tables) its line height is as much smaller, so that each
               box stays as tall as it was and no page moves. --head-em is the same for sizes in em, which
               follow the text: 1 when the text is VT323 too (gp-pixel). */
            --head-scale: 1.3; --head-em: 1.3;
        }
        /* Paper sizes: the page, its inner margins, and type that reads well at that size. */
        html.gp-a5 { --paper-w: 148mm; --paper-h: 210mm; --pad: 9mm 11mm 7mm 12mm; --body-size: 11pt; --fig-max: 85mm; --mob: 38mm; --icon: 17mm; }
        html.gp-a4 { --paper-w: 210mm; --paper-h: 297mm; --pad: 13mm 16mm 10mm 17mm; --body-size: 12pt; --fig-max: 140mm; --mob: 50mm; --icon: 22mm; }
        html.gp-a5.gp-pixel { --body-size: 14.5pt; }
        html.gp-a4.gp-pixel { --body-size: 15.5pt; }
        html.gp-pixel { --body-font: 'VT323', 'Courier New', monospace; --head-em: 1; }
        html.gp-parchment { --paper: #f6ebcf; --tint: #ead9b0; --code: #e6d3a4; --rule: #c2a46c; }
        * { box-sizing: border-box; }
        html { background: #6f6a62; }
        body { margin: 0; color: var(--ink); font-family: var(--body-font); font-size: var(--body-size); line-height: 1.36; }

        /* ---- toolbar (screen only) ---- */
        #gp-toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
            padding: 10px 16px; background: #3a2614; color: #f1e3c0; font: 15px/1.3 'Segoe UI', Verdana, sans-serif;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); }
        #gp-toolbar .gp-brand { font-family: var(--head-font); font-size: 26px; margin-right: 6px; }
        #gp-toolbar .gp-group { display: inline-flex; align-items: center; gap: 4px; }
        #gp-toolbar button { font: inherit; color: #f1e3c0; background: #6b4528; border: 0; padding: 5px 12px; cursor: pointer;
            box-shadow: inset 0 -3px 0 #3f2716, 0 0 0 2px #2c1a0e; }
        #gp-toolbar button.active, #gp-toolbar #gp-print:not(:disabled) { background: #9c2a2a; box-shadow: inset 0 -3px 0 #6d1b1b, 0 0 0 2px #2c1a0e; }
        #gp-toolbar button:disabled { opacity: 0.45; cursor: progress; }
        #gp-toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        #gp-toolbar .gp-status-row { flex-basis: 100%; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #e8d6aa; }
        #gp-progress { width: 180px; height: 10px; }
        #gp-folios { width: 3.4em; font: inherit; }
        #gp-booklet-options[hidden], #gp-volumes[hidden], #gp-report[hidden] { display: none; }
        #gp-report { flex-basis: 100%; font-size: 14px; color: #e8d6aa; }
        #gp-report summary { cursor: pointer; }
        #gp-report-body { max-height: 45vh; overflow: auto; margin: 6px 0; padding: 6px 10px; background: #2c1a0e; }
        #gp-report-body table { border-collapse: collapse; }
        #gp-report-body td { padding: 1px 10px 1px 0; vertical-align: top; }
        #gp-report-body .gp-report-volume td { padding-top: 6px; font-weight: bold; color: #f1e3c0; }
        #gp-report-body .gp-over td { color: #ff9b7a; }
        #gp-report-body p { margin: 6px 0 0; }

        /* ---- pages ---- */
        #gp-book { padding: 24px 12px 60px; }
        #gp-measure { position: absolute; left: -10000px; top: 0; visibility: hidden; pointer-events: none; }
        .gp-page { width: var(--paper-w); height: var(--paper-h); padding: var(--pad); margin: 0 auto 24px; background: var(--paper);
            display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            scroll-margin-top: 110px; }
        /* The header: the title, and the guide number as a chip at the outer corner (right on odd
           pages, left on even ones: js/guidePrint.js, emptyPage). Fixed pt and mm, so the body
           font never changes its height; min-height keeps pages without a chip the same. */
        .gp-head { display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid var(--rule); padding-bottom: 1.2mm;
            margin-bottom: 3.5mm; font-family: var(--head-font); color: var(--ink-soft); font-size: calc(9pt * var(--head-scale)); line-height: calc(1.2 / var(--head-scale)); flex: none;
            min-height: calc(12pt + 2.7mm + 1.5px); /* the chip (12pt + 1.5 mm), the padding and the rule */ }
        .gp-head-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gp-head-id { flex: none; font-family: var(--head-font); font-size: calc(12pt * var(--head-scale)); line-height: calc(1 / var(--head-scale)); font-weight: 400; color: var(--volume);
            border: 0.3mm solid var(--volume); border-radius: 0.8mm; padding: 0.5mm 1.6mm 0.4mm; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .gp-head-id:empty { display: none; }
        .gp-page.gp-even .gp-head { flex-direction: row-reverse; }
        .gp-page.gp-even .gp-head-title { text-align: right; }
        .gp-foot { flex: none; text-align: center; font-family: var(--head-font); font-size: calc(9.5pt * var(--head-scale)); line-height: calc(1.2 / var(--head-scale)); color: var(--ink-soft);
            padding-top: 2mm; white-space: nowrap; }
        .gp-foot-vol { font-size: calc(7.5pt * var(--head-scale)); }
        .gp-page-body { flex: 1; min-height: 0; display: flow-root; }
        .gp-measuring { height: auto; }
        .gp-measuring .gp-page-body { flex: none; }
        .gp-page-body > :first-child { margin-top: 0; }

        /* ---- covers (js/guidePrint.js, coverPage) ----
           One layout, in a box of exactly 148 x 210 mm that A4 scales by 1.414 from its top left
           corner. Everything inside is mm and pt, never em (the pixel font changes the body size),
           and the column is a flex column that cannot overflow: the picture gives way. The paper,
           the colours and the ink do not follow the ink saver; fills are SVG (printers keep those)
           and are also asked to print exactly. */
        .gp-page.gp-cover { display: block; padding: 0; background: #ffffff; --paper: #ffffff; --tint: #f1ead9; --rule: #b9a27a; }
        .gp-cover, .gp-cover * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .gp-cover-art { position: absolute; left: 0; top: 0; width: 148mm; height: 210mm; overflow: hidden; transform-origin: 0 0;
            font-family: 'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif; font-size: 10pt; line-height: 1.25; color: #2b1d10;
            text-align: center; }
        html.gp-a4 .gp-cover-art { transform: scale(1.414); }
        .gp-cover-art p { margin: 0; }
        .gp-cover-fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
        .gp-cover-frame { position: absolute; left: 7mm; top: 7mm; width: 134mm; height: 196mm; border: 1mm solid var(--volume); }
        .gp-cover-frame::after { content: ''; position: absolute; left: 1mm; top: 1mm; right: 1mm; bottom: 1mm; border: 0.25mm solid var(--rule); }
        .gp-cover-column { position: absolute; left: 6mm; top: 4mm; width: 120mm; height: 186mm; display: flex; flex-direction: column; z-index: 1; }
        .gp-cover-column > * { flex: none; }
        .gp-cover-mast { display: flex; align-items: center; justify-content: center; gap: 4mm; padding: 2mm 0 3mm;
            border-bottom: 0.4mm solid var(--rule); }
        .gp-cover-cube { width: 14mm; height: 14mm; flex: none; display: block; }
        .gp-cover-mast-words { text-align: left; min-width: 0; }
        .gp-cover-brand { font-family: var(--head-font); font-size: calc(30pt * var(--head-scale)); line-height: 1; color: #5b3a22; white-space: nowrap; }
        .gp-cover-strap { margin-top: 1.2mm; font-size: 9.5pt; line-height: 1.2; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase;
            color: #6b4f30; white-space: nowrap; }
        .gp-cover-column > .gp-cover-hero { flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
            padding: 4mm 0; }
        .gp-cover-tile { position: relative; width: 64mm; height: 64mm; max-height: 100%; flex: none; border: 0.8mm solid var(--volume); }
        .gp-cover-hero-img { position: absolute; left: 3mm; top: 3mm; width: calc(100% - 6mm); height: calc(100% - 6mm); object-fit: contain; }
        .gp-cover-hero-img.gp-cover-book, .gp-cover-hero-img.gp-item, .gp-cover-hero-img.gp-missing { image-rendering: pixelated; }
        .gp-cover-volume { display: flex; align-items: center; gap: 5mm; height: 30mm; margin-bottom: 4mm; text-align: left; }
        .gp-cover-numeral { position: relative; width: 30mm; height: 30mm; flex: none; display: flex; align-items: center; justify-content: center; }
        /* A white numeral with an outline of the colour: still readable if a printer drops the fill. */
        .gp-cover-numeral span, .gp-cover-tab span { position: relative; font-family: var(--head-font); font-weight: 400;
            line-height: 1; color: #ffffff; -webkit-text-stroke: 0.45mm var(--volume); paint-order: stroke fill; white-space: nowrap; }
        .gp-cover-numeral span { font-size: calc(60pt * var(--head-scale)); }
        .gp-cover-volume-words { flex: 1 1 auto; min-width: 0; }
        .gp-cover-label { font-size: 10pt; line-height: 1.2; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--volume);
            margin-bottom: 1mm; }
        .gp-cover-title { font-family: var(--head-font); font-weight: 400; font-size: calc(19pt * var(--head-scale)); line-height: 1; color: #5b3a22;
            max-height: calc(2 * 19pt * var(--head-scale)); overflow: hidden; overflow-wrap: break-word;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .gp-cover-volume.gp-cover-whole { justify-content: center; text-align: center; }
        .gp-cover-whole .gp-cover-title { font-size: calc(24pt * var(--head-scale)); max-height: calc(2 * 24pt * var(--head-scale)); }
        .gp-cover-icons { display: flex; align-items: center; justify-content: space-evenly; height: 18mm; margin-bottom: 4mm;
            border-top: 0.25mm solid var(--rule); border-bottom: 0.25mm solid var(--rule); }
        .gp-cover-icon { width: 13mm; height: 13mm; flex: none; object-fit: contain; image-rendering: pixelated; }
        .gp-cover-icon.gp-mob { image-rendering: auto; }
        .gp-cover-art .gp-cover-topics { font-size: 11pt; line-height: 1.25; font-weight: 700; margin-bottom: 1.5mm; white-space: nowrap; }
        .gp-cover-art .gp-cover-blurb { font-size: 9pt; line-height: 1.3; color: #6b4f30; margin: 0 4mm 2mm; max-height: calc(3 * 1.3 * 9pt);
            overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
        .gp-cover-edition { font-size: 7.5pt; line-height: 1.2; color: #6b4f30; letter-spacing: 0.02em; white-space: nowrap; }
        /* The tab on the edge: lower in each volume (top set by coverModel), a staircase on the shelf. */
        .gp-cover-tab { position: absolute; right: 0; width: 10mm; height: 22mm; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .gp-cover-tab span { font-size: calc(15pt * var(--head-scale)); -webkit-text-stroke-width: 0.3mm; }

        .gp-page-body h1, .gp-page-body h2, .gp-page-body h3 { font-family: var(--head-font); font-weight: 400; font-synthesis: none; color: #5b3a22; line-height: calc(1.15 / var(--head-em)); }
        .gp-page-body h1 { font-size: calc(1.7em * var(--head-em)); text-align: center; margin: 0 0 3mm; }
        .gp-page-body h2 { font-size: calc(1.25em * var(--head-em)); border-bottom: 2px dashed var(--rule); padding-bottom: 0.8mm; margin: 4mm 0 1.8mm; }
        .gp-page-body h3 { font-size: calc(1.08em * var(--head-em)); margin: 3mm 0 1.2mm; }
        .gp-page-body p, .gp-page-body ul, .gp-page-body ol { margin: 0 0 2mm; }
        .gp-page-body ul, .gp-page-body ol { padding-left: 1.4em; }
        .gp-page-body ul { list-style: none; }
        .gp-page-body ul > li::before { content: '■'; color: var(--accent); font-size: 0.6em; display: inline-block; width: 1.9em;
            margin-left: -1.9em; vertical-align: 0.2em; text-align: center; }
        .gp-page-body li { margin: 0.4mm 0; }
        .gp-page-body strong { color: #1c1208; }
        .gp-page-body em { color: var(--ink-soft); }
        .gp-page-body code { font-family: 'VT323', 'Courier New', monospace; font-size: 1.12em; background: var(--code); padding: 0 3px; }
        html.gp-pixel .gp-page-body code { font-size: 1em; }
        .gp-page-body a { color: var(--accent); text-decoration: none; }
        /* A link cites the topic by its guide number: "→ 213", "→ 34 · vol. 1" (js/guidePrint.js, linkLabel). */
        .gp-page-body a.gp-link::after { content: ' → ' attr(data-label); font-size: 0.82em; color: var(--ink-soft); white-space: nowrap; }
        .gp-page-body blockquote { margin: 2.5mm 0; padding: 1.5mm 3.5mm; background: var(--tint); border-left: 4px solid var(--rule); }
        .gp-page-body blockquote > :last-child { margin-bottom: 0; }
        .gp-page-body hr { border: 0; border-top: 3px dotted var(--rule); margin: 3mm 0; }
        .gp-page-body figure { margin: 2.5mm 0; text-align: center; }
        .gp-page-body figure img { max-width: 100%; max-height: var(--fig-max); image-rendering: pixelated; }
        .gp-page-body figure.gp-figure-mob img { width: var(--mob); height: var(--mob); object-fit: contain; image-rendering: auto; }
        .gp-page-body figure.gp-figure-item img, .gp-page-body figure img.gp-missing { width: var(--icon); height: var(--icon); }
        .gp-page-body figcaption { font-size: 0.88em; color: var(--ink-soft); margin-top: 1mm; }
        .gp-page-body p img, .gp-page-body li img, .gp-page-body td img, .gp-page-body th img { height: 1.3em; width: auto;
            vertical-align: -0.3em; image-rendering: pixelated; }
        .gp-page-body p img.gp-mob, .gp-page-body li img.gp-mob, .gp-page-body td img.gp-mob { height: 1.7em; image-rendering: auto; }
        .gp-page-body table { border-collapse: collapse; margin: 2.5mm 0; width: 100%; font-size: 0.84em; line-height: 1.25; }
        .gp-page-body table th, .gp-page-body table td { border: 1.2px solid var(--rule); padding: 0.8mm 1.6mm; text-align: left;
            vertical-align: top; overflow-wrap: anywhere; hyphens: auto; }
        .gp-page-body table th { background: var(--tint); font-family: var(--head-font); font-weight: 400; font-synthesis: none;
            font-size: calc(1em * var(--head-em)); line-height: calc(1.25 / var(--head-em)); }
        .gp-notice { text-align: center; color: var(--ink-soft); background: var(--tint); padding: 1.2mm 3mm; font-size: 0.9em; }

        .gp-page-body ul.gp-toc-list { padding: 0; margin-bottom: 2mm; font-size: 0.95em; }
        .gp-page-body ul.gp-toc-list > li::before { content: none; }
        .gp-toc-list a { display: flex; align-items: baseline; gap: 4px; color: inherit; }
        .gp-toc-title { min-width: 0; }
        .gp-toc-dots { flex: 1; border-bottom: 1.5px dotted var(--rule); min-width: 6mm; transform: translateY(-3px); }
        .gp-toc-num { font-variant-numeric: tabular-nums; color: var(--ink-soft); min-width: 2.2em; text-align: right; }
        /* The guide number first, in the volume's colour; the page last. */
        .gp-toc-id { flex: none; width: 2.4em; font-family: var(--head-font); font-weight: 400; font-variant-numeric: tabular-nums; color: var(--volume); }
        .gp-page-body p.gp-toc-key { font-size: 0.85em; color: var(--ink-soft); }
        .gp-page-body ul.gp-alpha-list { font-size: 0.85em; }
        .gp-page-body h3.gp-alpha-letter { color: var(--volume); margin: 2mm 0 0.8mm; }
        .gp-alpha-num { font-variant-numeric: tabular-nums; color: var(--volume); white-space: nowrap; text-align: right; }

        /* ---- booklets: two A5 pages side by side on an A4 landscape side ---- */
        .gp-spread { width: 297mm; height: 210mm; margin: 0 auto 24px; display: flex; background: var(--paper);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); }
        .gp-spread > .gp-page { margin: 0; box-shadow: none; flex: none; }
        .gp-spread > .gp-page + .gp-page { border-left: 1px dashed #d6cbb3; }
        .gp-spread.gp-turned { transform: rotate(180deg); }
        .gp-spread-label { width: 297mm; margin: 0 auto 6px; color: #f1e3c0; font: 13px 'Segoe UI', Verdana, sans-serif; }
        @media (max-width: 820px) {
            #gp-book { overflow-x: auto; }
        }
        @media print {
            html, body { background: var(--paper); }
            html.gp-parchment, html.gp-parchment body, html.gp-parchment .gp-page { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #gp-toolbar, #gp-measure { display: none !important; }
            #gp-book { padding: 0; }
            /* A hair shorter than the paper, so rounding never spills a blank page. */
            .gp-page { margin: 0; box-shadow: none; height: calc(var(--paper-h) - 0.5mm); break-after: page; page-break-after: always; }
            .gp-page:last-child { break-after: auto; page-break-after: auto; }
            .gp-spread-label { display: none; }
            .gp-spread { margin: 0; box-shadow: none; height: calc(210mm - 0.5mm); overflow: hidden; break-after: page; page-break-after: always; }
            .gp-spread:last-child { break-after: auto; page-break-after: auto; }
            .gp-spread > .gp-page { height: calc(var(--paper-h) - 0.5mm); break-after: auto; page-break-after: auto; }
            .gp-spread > .gp-page + .gp-page { border-left: 0; }
        }
    </style>
</head>
<body>
    <div id="gp-toolbar">
        <span class="gp-brand">MineCloud</span>
        <span class="gp-group"><button class="gp-lang" type="button" data-lang="ES">ES</button><button class="gp-lang" type="button" data-lang="EN">EN</button></span>
        <span class="gp-group"><span id="gp-paper-label">Papel</span> <button class="gp-paper" type="button" data-paper="A5">A5</button><button class="gp-paper" type="button" data-paper="A4">A4</button><button class="gp-paper" type="button" data-paper="BOOKLET">Librillos A4</button></span>
        <span id="gp-booklet-options" class="gp-group" hidden><label><span id="gp-folios-label">Folios por librillo</span> <input id="gp-folios" type="number" min="1" max="15" step="1" value="6"></label>
            <label><input id="gp-long-edge" type="checkbox"> <span id="gp-long-edge-label">Volteo por borde largo</span></label></span>
        <label><input id="gp-ink" type="checkbox" checked> <span id="gp-ink-label">Ahorrar tinta</span></label>
        <span class="gp-group"><button class="gp-font" type="button" data-pixel="0">Fuente clara</button><button class="gp-font" type="button" data-pixel="1">Fuente pixel</button></span>
        <span id="gp-volumes" class="gp-group" hidden><span id="gp-volume-label">Volumen</span> </span>
        <button id="gp-print" type="button" disabled>🖨 Imprimir</button>
        <div class="gp-status-row">
            <progress id="gp-progress" max="1" value="0"></progress>
            <span id="gp-status">…</span>
        </div>
        <details id="gp-report" hidden><summary id="gp-report-summary">Páginas por volumen</summary><div id="gp-report-body"></div>
            <button id="gp-report-copy" type="button">Copiar informe</button> <span id="gp-report-copied"></span></details>
    </div>
    <main id="gp-book"></main>
    <div id="gp-measure" aria-hidden="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/guideMarkdown.js"></script>
    <script>
        // The game's scripts mix their methods into Game.prototype; here there is no game to
        // run, only a class for them to hang on (the portraits use the bestiary's methods).
        class Game {}
    </script>
    <script src="js/guidePrint.js"></script>
</body>
</html>
