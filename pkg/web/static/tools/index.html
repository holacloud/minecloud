<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineCloud Server Terrain Inspector</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #050913; color: #e9f4ff; font: 13px/1.35 Consolas, monospace; }
        #viewport { position: fixed; inset: 0; }
        #panel { position: fixed; top: 14px; left: 14px; width: min(360px, calc(100vw - 28px)); max-height: calc(100vh - 28px); overflow: auto; padding: 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(6,12,24,.88); box-shadow: 0 18px 55px rgba(0,0,0,.45); backdrop-filter: blur(10px); }
        h1 { margin: 0 0 6px; font-size: 17px; }
        p { margin: 0 0 12px; color: #a9bdd3; }
        label { display: block; margin: 10px 0 5px; color: #c8dcf1; }
        input, select, button { width: 100%; min-height: 34px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; background: rgba(255,255,255,.08); color: #fff; padding: 0 10px; font: inherit; }
        input[type="range"] { padding: 0; }
        input[type="checkbox"] { width: auto; min-height: auto; margin-right: 7px; }
        button { cursor: pointer; margin-top: 12px; background: rgba(64,130,194,.48); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        #status { margin-top: 10px; color: #8fb8d8; white-space: pre-line; }
        #help { position: fixed; right: 14px; bottom: 14px; max-width: min(430px, calc(100vw - 28px)); padding: 10px 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; background: rgba(4,9,18,.78); color: #c5d6e6; white-space: pre-line; }
        #fps { position: fixed; right: 14px; top: 14px; padding: 7px 10px; border-radius: 10px; background: rgba(4,9,18,.78); color: #d8f4ff; border: 1px solid rgba(255,255,255,.14); }
        #crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.82); }
        #crosshair::before { width: 2px; height: 14px; left: 6px; }
        #crosshair::after { width: 14px; height: 2px; top: 6px; }
        @media (max-width: 760px) { #panel { width: calc(100vw - 28px); max-height: 48vh; } #help { display: none; } }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="crosshair"></div>
    <div id="fps">FPS: --</div>
    <aside id="panel">
        <h1>Server Terrain Inspector</h1>
        <p>Reads generated terrain from the server. The tool does not contain terrain generation logic.</p>
        <div class="grid">
            <div><label for="center-x">Center X</label><input id="center-x" type="number" value="0" step="16"></div>
            <div><label for="center-z">Center Z</label><input id="center-z" type="number" value="0" step="16"></div>
        </div>
        <div class="grid">
            <div><label for="radius">Radius</label><select id="radius"><option value="80">80</option><option value="160" selected>160</option><option value="320">320</option><option value="640">640</option><option value="1200">1200</option><option value="2400">2400</option></select></div>
            <div><label for="step">Sampling</label><select id="step"><option value="adaptive" selected>Adaptive distance LOD</option><option value="1">Fixed 1</option><option value="2">Fixed 2</option><option value="4">Fixed 4</option><option value="8">Fixed 8</option><option value="16">Fixed 16</option><option value="32">Fixed 32</option><option value="48">Fixed 48</option></select></div>
        </div>
        <label for="clip-y">Y cut: show blocks at or below <span id="clip-y-value">256</span></label>
        <input id="clip-y" type="range" min="-59" max="256" value="256">
        <label for="camera-speed">Camera speed</label>
        <input id="camera-speed" type="range" min="10" max="180" value="52">
        <label for="render-style">Render style</label>
        <select id="render-style"><option value="color" selected>Solid colors</option><option value="texture">Game-like textures</option></select>
        <label><input id="auto-stream" type="checkbox" checked> Auto stream while moving</label>
        <button id="reload">Load Server Terrain</button>
        <button id="jump-camera">Jump Camera To Center</button>
        <div id="status">Loading...</div>
    </aside>
    <div id="help">Click viewport to lock pointer.
WASD move, Space up, Shift down.
Mouse look. Hold Alt for 3x speed.
Change Y cut to inspect underground caves.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const blockColors = { grass: 0x5B8C35, dirt: 0x8B5A2B, stone: 0x808080, cobblestone: 0x6E6E6E, sand: 0xE8D894, water: 0x3D85C6, ice: 0xA9D8F5, bedrock: 0x1A1A1A, coal_ore: 0x3d3d3d, iron_ore: 0xB87E56, gold_ore: 0xD4AF37, white_wool: 0xF4F4F0, orange_brick: 0xE88932, red_brick: 0xB93A32 };
        const blockNames = { grass: 'Grass', dirt: 'Dirt', stone: 'Stone', cobblestone: 'Cobblestone', sand: 'Sand', water: 'Water', ice: 'Ice', bedrock: 'Bedrock', coal_ore: 'Coal Ore', iron_ore: 'Iron Ore', gold_ore: 'Gold Ore', white_wool: 'Snow', orange_brick: 'Orange Terracotta', red_brick: 'Red Terracotta' };
        const viewport = document.getElementById('viewport');
        const statusEl = document.getElementById('status');
        const fpsEl = document.getElementById('fps');
        const clipInput = document.getElementById('clip-y');
        const clipValue = document.getElementById('clip-y-value');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07101c);
        scene.fog = new THREE.Fog(0x07101c, 160, 520);
        const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 900);
        camera.position.set(0, 38, 38);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
        viewport.appendChild(renderer.domElement);
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const loadedMeshes = [];
        const regionMeshes = new Map();
        const regionBlockCounts = new Map();
        const regionBounds = new Map();
        const regionBaseToKey = new Map();
        const materialCache = new Map();
        const textureCache = new Map();
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2(0, 0);
        const clock = new THREE.Clock();
        const keyState = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, Space: false, ShiftLeft: false, ShiftRight: false, AltLeft: false, AltRight: false };
        let yaw = -0.75;
        let pitch = -0.46;
        let lastStats = null;
        let loadingArea = false;
        let loadToken = 0;
        let lastAutoLoadAt = 0;
        let pointerLockCooldownUntil = 0;
        let fps = 0;
        let fpsFrames = 0;
        let fpsElapsed = 0;
        const frustum = new THREE.Frustum();
        const projectionView = new THREE.Matrix4();
        const payloadCache = new Map();
        const decodedCache = new Map();
        const cacheWeights = new Map();
        const maxCachedVoxels = 40000000;
        let cachedVoxels = 0;

        function materialFor(type) {
            const style = document.getElementById('render-style').value;
            const key = `${style}:${type}`;
            if (materialCache.has(key)) return materialCache.get(key);
            const transparent = type === 'water' || type === 'ice';
            const params = { color: blockColors[type] || 0xffffff, transparent, opacity: type === 'water' ? 0.48 : type === 'ice' ? 0.62 : 1, depthWrite: !transparent };
            if (style === 'texture') {
                params.map = textureFor(type);
                params.color = 0xffffff;
            }
            const material = new THREE.MeshLambertMaterial(params);
            materialCache.set(key, material);
            return material;
        }
        function textureFor(type) {
            if (textureCache.has(type)) return textureCache.get(type);
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const base = blockColors[type] || 0xffffff;
            const css = `#${base.toString(16).padStart(6, '0')}`;
            ctx.fillStyle = css;
            ctx.fillRect(0, 0, 16, 16);
            const shade = (alpha) => { ctx.fillStyle = `rgba(0,0,0,${alpha})`; };
            if (type === 'grass') {
                ctx.fillStyle = '#5B8C35'; ctx.fillRect(0, 0, 16, 9); ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, 9, 16, 7); ctx.fillStyle = 'rgba(80,130,45,.8)'; for (let x = 0; x < 16; x += 3) ctx.fillRect(x, 0, 1, 9);
            } else if (type === 'stone' || type === 'cobblestone') {
                shade(0.22); for (let y = 2; y < 16; y += 5) ctx.fillRect(0, y, 16, 1); for (let x = 3; x < 16; x += 6) ctx.fillRect(x, 0, 1, 16);
            } else if (type === 'sand') {
                shade(0.12); for (let i = 0; i < 28; i++) ctx.fillRect((i * 7) % 16, (i * 11) % 16, 1, 1);
            } else if (type === 'water' || type === 'ice') {
                ctx.fillStyle = 'rgba(255,255,255,.28)'; for (let y = 3; y < 16; y += 5) ctx.fillRect(0, y, 16, 1);
            } else if (type.includes('ore')) {
                ctx.fillStyle = '#777'; ctx.fillRect(0, 0, 16, 16); ctx.fillStyle = css; for (let i = 0; i < 6; i++) ctx.fillRect((i * 5 + 2) % 14, (i * 7 + 1) % 14, 2, 2);
            } else if (type.includes('brick')) {
                shade(0.24); for (let y = 4; y < 16; y += 5) ctx.fillRect(0, y, 16, 1); for (let y = 0; y < 16; y += 5) for (let x = (y / 5) % 2 ? 0 : 8; x < 16; x += 16) ctx.fillRect(x, y, 1, 5);
            } else {
                shade(0.1); ctx.fillRect(0, 0, 16, 1); ctx.fillRect(0, 0, 1, 16);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            textureCache.set(type, texture);
            return texture;
        }
        function disposeLoadedMeshes() {
            for (const mesh of loadedMeshes) scene.remove(mesh);
            loadedMeshes.length = 0;
            regionMeshes.clear();
            regionBlockCounts.clear();
            regionBounds.clear();
            regionBaseToKey.clear();
        }
        function effectiveStep(radius) {
            const requested = Number(document.getElementById('step').value);
            if (Number.isFinite(requested) && requested > 0) return requested;
            if (radius <= 160) return 1;
            if (radius <= 320) return 4;
            if (radius <= 640) return 8;
            if (radius <= 1200) return 16;
            return 32;
        }
        function isAdaptiveLod() {
            return document.getElementById('step').value === 'adaptive';
        }
        function tileSizeFor(radius, step) {
            if (radius >= 640) return 256;
            return Math.max(128, Math.min(256, step * 32));
        }
        function lodStepForRing(ring, baseStep) {
            if (!isAdaptiveLod()) return baseStep;
            if (ring <= 1) return 1;
            if (ring === 2) return 2;
            if (ring === 3) return 4;
            if (ring <= 5) return 8;
            if (ring <= 8) return 16;
            return 32;
        }
        function appendBlocks(blocks, step, verticalStep) {
            return createMeshesForBlocks(blocks, step, verticalStep);
        }
        function createMeshesForBlocks(blocks, step, verticalStep) {
            const byType = new Map();
            for (const block of blocks) {
                if (!byType.has(block.type)) byType.set(block.type, []);
                byType.get(block.type).push(block);
            }
            const dummy = new THREE.Object3D();
            const sx = step > 1 ? Math.max(0.72, step * 0.72) : 1;
            const sy = verticalStep > 1 ? Math.max(0.72, verticalStep * 0.72) : 1;
            const meshes = [];
            for (const [type, typeBlocks] of byType.entries()) {
                const mesh = new THREE.InstancedMesh(blockGeometry, materialFor(type), typeBlocks.length);
                mesh.userData.blockType = type;
                for (let i = 0; i < typeBlocks.length; i++) {
                    const b = typeBlocks[i];
                    dummy.position.set(b.x + 0.5, b.y + 0.5, b.z + 0.5);
                    dummy.scale.set(sx, sy, sx);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                }
                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);
                loadedMeshes.push(mesh);
                meshes.push(mesh);
            }
            return meshes;
        }
        function removeMeshes(meshes) {
            for (const mesh of meshes || []) {
                scene.remove(mesh);
                const index = loadedMeshes.indexOf(mesh);
                if (index >= 0) loadedMeshes.splice(index, 1);
            }
        }
        function reconcileRegions(wantedKeys) {
            for (const [key, meshes] of Array.from(regionMeshes.entries())) {
                if (wantedKeys.has(key)) continue;
                removeMeshes(meshes);
                regionMeshes.delete(key);
                regionBlockCounts.delete(key);
                regionBounds.delete(key);
                for (const [base, mappedKey] of Array.from(regionBaseToKey.entries())) if (mappedKey === key) regionBaseToKey.delete(base);
            }
        }
        function decodeTile(tile) {
            const blocks = [];
            if (tile.mode === 'surface') {
                let index = 0;
                for (let x = tile.originX; x <= tile.originX + tile.size; x += tile.step) {
                    for (let z = tile.originZ; z <= tile.originZ + tile.size; z += tile.step) {
                        const type = tile.palette[tile.surfaceTypes[index]];
                        if (type && type !== 'air') blocks.push({ x, y: tile.surfaceY[index], z, type });
                        index++;
                    }
                }
            } else {
                for (let i = 0; i < (tile.types || []).length; i++) {
                    blocks.push({ x: tile.x[i], y: tile.y[i], z: tile.z[i], type: tile.palette[tile.types[i]] });
                }
            }
            return blocks;
        }
        function decodeCube(cube) {
            const raw = atob(cube.data || '');
            const data = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) data[i] = raw.charCodeAt(i);
            const blocks = [];
            const size = cube.size;
            const indexAt = (x, y, z) => (y * size + z) * size + x;
            const isOpaque = (type) => type && type !== 'air' && type !== 'water' && type !== 'ice' && type !== 'leaves' && !type.endsWith('_leaves') && type !== 'tall_grass' && type !== 'flower_red' && type !== 'flower_yellow' && type !== 'mushroom_red' && type !== 'mushroom_brown';
            const isOpen = (x, y, z) => x < 0 || y < 0 || z < 0 || x >= size || y >= size || z >= size || !isOpaque(cube.palette[data[indexAt(x, y, z)]] || 'air');
            for (let y = 0; y < size; y++) {
                for (let z = 0; z < size; z++) {
                    for (let x = 0; x < size; x++) {
                        const type = cube.palette[data[indexAt(x, y, z)]] || 'air';
                        if (type === 'air') continue;
                        if (!isOpen(x + 1, y, z) && !isOpen(x - 1, y, z) && !isOpen(x, y + 1, z) && !isOpen(x, y - 1, z) && !isOpen(x, y, z + 1) && !isOpen(x, y, z - 1)) continue;
                        blocks.push({ x: cube.originX + x, y: cube.originY + y, z: cube.originZ + z, type });
                    }
                }
            }
            return blocks;
        }
        function cacheKeyFor(useCubes, origin, tileSize, step, clipY, mode) {
            return useCubes
                ? `cube:${origin[0]}:${origin[1]}:${origin[2]}:64`
                : `tile:${origin[0]}:${origin[1]}:${tileSize}:${step}:${clipY}:${mode}`;
        }
        function baseKeyFor(useCubes, origin, tileSize, clipY, mode) {
            return useCubes
                ? `cube:${origin[0]}:${origin[1]}:${origin[2]}:64`
                : `tile:${origin[0]}:${origin[1]}:${tileSize}:${clipY}:${mode}`;
        }
        function replaceOverlappingRegion(baseKey, cacheKey) {
            const previous = regionBaseToKey.get(baseKey);
            if (!previous || previous === cacheKey) return;
            removeMeshes(regionMeshes.get(previous));
            regionMeshes.delete(previous);
            regionBlockCounts.delete(previous);
            regionBounds.delete(previous);
            regionBaseToKey.delete(baseKey);
        }
        function setRegionBounds(key, useCubes, origin, size) {
            const y = useCubes ? origin[1] + size / 2 : 20;
            const z = useCubes ? origin[2] + size / 2 : origin[1] + size / 2;
            regionBounds.set(key, { center: new THREE.Vector3(origin[0] + size / 2, y, z), radius: Math.sqrt(3) * size * 0.5 });
        }
        function updateRegionVisibility() {
            projectionView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projectionView);
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const sphere = new THREE.Sphere();
            for (const [key, meshes] of regionMeshes.entries()) {
                const bounds = regionBounds.get(key);
                if (!bounds) continue;
                const toRegion = bounds.center.clone().sub(camera.position);
                const near = toRegion.lengthSq() <= bounds.radius * bounds.radius;
                const inFront = near || forward.dot(toRegion.normalize()) > -0.12;
                sphere.center.copy(bounds.center);
                sphere.radius = bounds.radius;
                const visible = inFront && frustum.intersectsSphere(sphere);
                for (const mesh of meshes) mesh.visible = visible;
            }
        }
        function payloadWeight(payload) {
            if (payload && payload.size) return payload.size * payload.size * payload.size;
            if (payload && payload.surfaceTypes) return payload.surfaceTypes.length;
            if (payload && payload.types) return payload.types.length;
            return 1;
        }
        function touchPayloadCache(key, value) {
            if (payloadCache.has(key)) {
                payloadCache.delete(key);
                cachedVoxels -= cacheWeights.get(key) || 0;
            }
            const weight = payloadWeight(value);
            payloadCache.set(key, value);
            cacheWeights.set(key, weight);
            cachedVoxels += weight;
            while (cachedVoxels > maxCachedVoxels && payloadCache.size > 0) {
                const oldest = payloadCache.keys().next().value;
                payloadCache.delete(oldest);
                decodedCache.delete(oldest);
                cachedVoxels -= cacheWeights.get(oldest) || 0;
                cacheWeights.delete(oldest);
            }
        }
        function touchDecodedCache(key, value) {
            if (decodedCache.has(key)) decodedCache.delete(key);
            decodedCache.set(key, value);
        }
        async function getPayload(cacheKey, url) {
            if (payloadCache.has(cacheKey)) {
                const cached = payloadCache.get(cacheKey);
                touchPayloadCache(cacheKey, cached);
                return { payload: cached, cached: true };
            }
            const response = await fetch(url, { cache: 'no-store' });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || `${response.status} ${response.statusText}`);
            touchPayloadCache(cacheKey, payload);
            return { payload, cached: false };
        }
        function getDecodedBlocks(cacheKey, payload, useCubes) {
            if (decodedCache.has(cacheKey)) {
                const cached = decodedCache.get(cacheKey);
                touchDecodedCache(cacheKey, cached);
                return cached;
            }
            const blocks = useCubes ? decodeCube(payload) : decodeTile(payload);
            touchDecodedCache(cacheKey, blocks);
            return blocks;
        }
        async function loadArea(options = {}) {
            const token = ++loadToken;
            loadingArea = true;
            const centerXInput = document.getElementById('center-x');
            const centerZInput = document.getElementById('center-z');
            const centerX = Number.isFinite(options.centerX) ? options.centerX : Number(centerXInput.value) || 0;
            const centerZ = Number.isFinite(options.centerZ) ? options.centerZ : Number(centerZInput.value) || 0;
            const radius = Number(document.getElementById('radius').value) || 160;
            const step = effectiveStep(radius);
            const clipY = Number(clipInput.value);
            centerXInput.value = String(centerX);
            centerZInput.value = String(centerZ);
            clipValue.textContent = String(clipY);
            camera.far = Math.max(900, radius * 2.8);
            camera.updateProjectionMatrix();
            scene.fog.near = Math.max(140, radius * 0.42);
            scene.fog.far = Math.max(520, radius * 1.6);
            const mode = isAdaptiveLod() && radius >= 640 ? 'surface' : 'visible';
            statusEl.textContent = `Loading server terrain...\nCenter: ${centerX}, ${centerZ}\nRadius: ${radius}, step: ${step}\nMode: ${mode}`;
            const tileSize = tileSizeFor(radius, step);
            const minX = centerX - radius;
            const maxX = centerX + radius;
            const minZ = centerZ - radius;
            const maxZ = centerZ + radius;
            const origins = [];
            const useCubes = mode !== 'surface';
            if (useCubes) {
                const cubeSize = 64;
                const camY = Math.floor(camera.position.y / cubeSize) * cubeSize;
                let minY = Math.max(-59, camY - cubeSize);
                let maxY = Math.min(clipY, camY + cubeSize);
                if (minY > maxY) {
                    minY = Math.floor(Math.max(-59, clipY - cubeSize) / cubeSize) * cubeSize;
                    maxY = clipY;
                }
                for (let x = Math.floor(minX / cubeSize) * cubeSize; x <= maxX; x += cubeSize) {
                    for (let z = Math.floor(minZ / cubeSize) * cubeSize; z <= maxZ; z += cubeSize) {
                        const distance = Math.hypot(x + cubeSize / 2 - camera.position.x, z + cubeSize / 2 - camera.position.z);
                        if (isAdaptiveLod() && distance > Math.max(220, radius * 0.32)) continue;
                        for (let y = minY; y <= maxY; y += cubeSize) origins.push([x, y, z, 1]);
                    }
                }
            } else {
                const cameraTileX = Math.floor(camera.position.x / tileSize) * tileSize;
                const cameraTileZ = Math.floor(camera.position.z / tileSize) * tileSize;
                for (let x = Math.floor(minX / tileSize) * tileSize; x <= maxX; x += tileSize) {
                    for (let z = Math.floor(minZ / tileSize) * tileSize; z <= maxZ; z += tileSize) {
                        const ring = Math.max(Math.abs(Math.round((x - cameraTileX) / tileSize)), Math.abs(Math.round((z - cameraTileZ) / tileSize)));
                        origins.push([x, z, lodStepForRing(ring, step), ring]);
                    }
                }
            }
            origins.sort((a, b) => {
                const ay = useCubes ? a[1] : camera.position.y;
                const by = useCubes ? b[1] : camera.position.y;
                const az = useCubes ? a[2] : a[1];
                const bz = useCubes ? b[2] : b[1];
                return Math.hypot(a[0] - camera.position.x, ay - camera.position.y, az - camera.position.z) - Math.hypot(b[0] - camera.position.x, by - camera.position.y, bz - camera.position.z);
            });
            if (origins.length === 0) {
                statusEl.textContent = `No regions to load for current Y cut (${clipY}). Existing terrain kept.`;
                loadingArea = false;
                return;
            }
            let loaded = 0;
            let drawn = 0;
            let cacheHits = 0;
            const wantedKeys = new Set(origins.map((origin) => cacheKeyFor(useCubes, origin, tileSize, useCubes ? 1 : origin[2], clipY, mode)));
            const wantedBaseKeys = new Set(origins.map((origin) => baseKeyFor(useCubes, origin, tileSize, clipY, mode)));
            for (const [baseKey, mappedKey] of Array.from(regionBaseToKey.entries())) {
                if (wantedBaseKeys.has(baseKey)) continue;
                removeMeshes(regionMeshes.get(mappedKey));
                regionMeshes.delete(mappedKey); regionBlockCounts.delete(mappedKey); regionBounds.delete(mappedKey); regionBaseToKey.delete(baseKey);
            }
            lastStats = { centerX, centerZ, radius, step, clipY, mode, blocks: [] };
            const concurrency = 4;
            let cursor = 0;
            const loadNext = async () => {
                while (cursor < origins.length && token === loadToken) {
                    const origin = origins[cursor++];
                    let url;
                    if (useCubes) {
                        url = `/api/terrain/cube?x=${origin[0]}&y=${origin[1]}&z=${origin[2]}&size=64`;
                    } else {
                        const [x, z, tileStep] = origin;
                        url = `/api/terrain/tile?x=${x}&z=${z}&size=${tileSize}&step=${tileStep}&clipY=${clipY}&mode=${mode}`;
                    }
                    const cacheKey = cacheKeyFor(useCubes, origin, tileSize, useCubes ? 1 : origin[2], clipY, mode);
                    const baseKey = baseKeyFor(useCubes, origin, tileSize, clipY, mode);
                    if (regionMeshes.has(cacheKey)) {
                        loaded++;
                        drawn += regionBlockCounts.get(cacheKey) || 0;
                        continue;
                    }
                    replaceOverlappingRegion(baseKey, cacheKey);
                    let payload;
                    try {
                        const result = await getPayload(cacheKey, url);
                        payload = result.payload;
                        if (result.cached) cacheHits++;
                    } catch (error) {
                        if (token === loadToken) statusEl.textContent = `Tile request failed: ${error.message}\nUse Adaptive distance LOD for large radii or increase fixed sampling.`;
                        continue;
                    }
                    if (token !== loadToken) return;
                    const blocks = getDecodedBlocks(cacheKey, payload, useCubes);
                    const meshes = createMeshesForBlocks(blocks, useCubes ? 1 : payload.step, useCubes ? 1 : payload.verticalStep);
                    regionMeshes.set(cacheKey, meshes);
                    regionBaseToKey.set(baseKey, cacheKey);
                    regionBlockCounts.set(cacheKey, blocks.length);
                    setRegionBounds(cacheKey, useCubes, origin, useCubes ? 64 : tileSize);
                    loaded++;
                    drawn += blocks.length;
                    lastStats.blocksDrawn = drawn;
                    statusEl.textContent = `FPS: ${fps}\nCenter: ${centerX}, ${centerZ}\nY cut: <= ${clipY}\nRadius: ${radius}, step: ${step}\nMode: ${mode}\nTiles: ${loaded}/${origins.length}\nCache hits: ${cacheHits}\nRegions cached: ${regionMeshes.size}\nBlocks drawn: ${drawn.toLocaleString()}`;
                    await new Promise((resolve) => requestAnimationFrame(resolve));
                }
            };
            await Promise.all(Array.from({ length: Math.min(concurrency, origins.length) }, loadNext));
            if (token === loadToken) reconcileRegions(wantedKeys);
            loadingArea = false;
        }
        async function jumpCameraToCenter() {
            const centerX = Number(document.getElementById('center-x').value) || 0;
            const centerZ = Number(document.getElementById('center-z').value) || 0;
            const response = await fetch(`/api/terrain/inspect?x=${centerX}&z=${centerZ}&radius=16&step=16&clipY=256`, { cache: 'no-store' });
            const data = await response.json();
            camera.position.set(centerX + 22, Math.max(data.center.height + 22, Number(clipInput.value) + 10), centerZ + 36);
            yaw = -0.58;
            pitch = -0.45;
        }
        function updateCamera(delta) {
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const move = new THREE.Vector3();
            if (keyState.KeyW) move.add(forward); if (keyState.KeyS) move.sub(forward); if (keyState.KeyD) move.add(right); if (keyState.KeyA) move.sub(right); if (keyState.Space) move.y += 1; if (keyState.ShiftLeft || keyState.ShiftRight) move.y -= 1;
            if (move.lengthSq() > 0) { const speed = Number(document.getElementById('camera-speed').value) || 52; move.normalize().multiplyScalar(speed * (keyState.AltLeft || keyState.AltRight ? 3 : 1) * delta); camera.position.add(move); }
            camera.rotation.y = yaw; camera.rotation.x = pitch;
        }
        function maybeAutoStream() {
            if (!lastStats || loadingArea || !document.getElementById('auto-stream').checked) return;
            const now = performance.now(); if (now - lastAutoLoadAt < 700) return;
            const dx = camera.position.x - lastStats.centerX; const dz = camera.position.z - lastStats.centerZ; const threshold = Math.max(32, lastStats.radius * 0.38);
            if (Math.sqrt(dx * dx + dz * dz) < threshold) return;
            lastAutoLoadAt = now; const centerX = Math.round(camera.position.x / 16) * 16; const centerZ = Math.round(camera.position.z / 16) * 16; loadArea({ centerX, centerZ });
        }
        function updateInspectRay() {
            if (!lastStats || performance.now() % 120 > 18) return;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(loadedMeshes, false);
            if (!hits.length) return;
            const hit = hits[0]; const type = hit.object.userData.blockType; const p = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(-0.02));
            statusEl.textContent = `FPS: ${fps}\nCenter: ${lastStats.centerX}, ${lastStats.centerZ}\nBlock: ${blockNames[type] || type}\nXYZ: ${Math.floor(p.x)}, ${Math.floor(p.y)}, ${Math.floor(p.z)}\nY cut: <= ${lastStats.clipY}\nRegions visible: ${regionMeshes.size}\nBlocks drawn: ${(lastStats.blocksDrawn || 0).toLocaleString()}`;
        }
        function animate() { requestAnimationFrame(animate); const delta = Math.min(0.05, clock.getDelta()); fpsFrames++; fpsElapsed += delta; if (fpsElapsed >= 0.5) { fps = Math.round(fpsFrames / fpsElapsed); fpsFrames = 0; fpsElapsed = 0; fpsEl.textContent = `FPS: ${fps}`; } updateCamera(delta); updateRegionVisibility(); maybeAutoStream(); updateInspectRay(); renderer.render(scene, camera); }
        scene.add(new THREE.AmbientLight(0x90a8c4, 0.72)); const sun = new THREE.DirectionalLight(0xffffff, 0.88); sun.position.set(80, 120, 50); scene.add(sun); const grid = new THREE.GridHelper(640, 40, 0x2d5c84, 0x173044); grid.position.y = -59.01; scene.add(grid);
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        document.addEventListener('keydown', (event) => { if (event.code in keyState) { keyState[event.code] = true; event.preventDefault(); } });
        document.addEventListener('keyup', (event) => { if (event.code in keyState) { keyState[event.code] = false; event.preventDefault(); } });
        document.addEventListener('mousemove', (event) => { if (document.pointerLockElement !== renderer.domElement) return; yaw -= event.movementX * 0.002; pitch -= event.movementY * 0.002; pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch)); });
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== renderer.domElement) {
                pointerLockCooldownUntil = performance.now() + 650;
            }
        });
        renderer.domElement.addEventListener('click', () => {
            if (document.pointerLockElement === renderer.domElement) return;
            if (performance.now() < pointerLockCooldownUntil) return;
            const request = renderer.domElement.requestPointerLock();
            if (request && typeof request.catch === 'function') {
                request.catch(() => {
                    pointerLockCooldownUntil = performance.now() + 900;
                });
            }
        });
        document.getElementById('reload').addEventListener('click', () => loadArea());
        document.getElementById('render-style').addEventListener('change', () => { materialCache.clear(); disposeLoadedMeshes(); loadArea(); });
        document.getElementById('jump-camera').addEventListener('click', jumpCameraToCenter);
        clipInput.addEventListener('input', () => { clipValue.textContent = clipInput.value; });
        clipInput.addEventListener('change', () => loadArea());
        ['center-x', 'center-z', 'radius', 'step'].forEach((id) => document.getElementById(id).addEventListener('change', () => loadArea()));
        loadArea(); jumpCameraToCenter(); animate();
    </script>
